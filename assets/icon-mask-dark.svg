<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 36 36" width="96" height="96" role="img" aria-label="mask">
<style>
*{fill:none;stroke:#FF7A45;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.s{animation:s 1.8s steps(1) infinite} .s2{animation-delay:.6s} .s3{animation-delay:1.2s}
@keyframes s{0%,33%{stroke:#3DD9C5;fill:#3DD9C5}34%,100%{fill:none}}
.scanl{stroke:#3DD9C5;animation:sc 2.2s ease-in-out infinite}
@keyframes sc{0%,100%{transform:translateY(-2px);opacity:0}20%{opacity:1}80%{transform:translateY(12px);opacity:1}}
.trav{fill:#3DD9C5;stroke:none;offset-path:path("M4 16h9l6-7h9");animation:tr 2s linear infinite}
@keyframes tr{from{offset-distance:0%}to{offset-distance:100%}}
.d{animation:d 2.8s cubic-bezier(.5,0,.6,1) infinite} .d2{animation-delay:.25s} .d3{animation-delay:.5s}
@keyframes d{0%{transform:translateY(-12px);opacity:0}25%,85%{transform:none;opacity:1}100%{opacity:0}}
.bl{animation:b 1.1s steps(1) infinite} @keyframes b{50%{opacity:0}}
.gr{transform-box:fill-box;transform-origin:bottom;animation:g 2.4s cubic-bezier(.6,0,.3,1) infinite} .g2{animation-delay:.2s} .g3{animation-delay:.4s}
@keyframes g{0%{transform:scaleY(.4)}40%,80%{transform:scaleY(1)}100%{transform:scaleY(.4)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x="4" y="9" width="24" height="14" rx="1"/><path class="s s1" d="M8 16h4"/><path class="s s2" d="M14 16h4"/><path class="s s3" d="M20 16h4"/>
</svg>
